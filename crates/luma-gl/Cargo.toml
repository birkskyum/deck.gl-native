[package]
name = "luma-gl"
description = "Rust port of luma.gl: thin model, shader assembly and uniform block helpers over wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rayon = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true }
naga = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
pollster = { workspace = true }

# On wasm32 the WebGPU backend's handles are not Send or Sync (they wrap `Rc`), which the
# layer traits need. wgpu offers them anyway for single threaded wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
