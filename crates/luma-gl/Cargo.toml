[package]
name = "luma-gl"
description = "Rust port of luma.gl: thin model, shader assembly and uniform block helpers over wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# Spread big uploads and tessellation over the cores with rayon. Off for wasm32, which has
# no threads to spread over.
parallel = ["dep:rayon"]
# Draw through wgpu's WebGL2 backend rather than WebGPU. naga lowers the WGSL to GLSL ES 3.00,
# which every layer shader is checked against by `LUMA_GL_CHECK_GLSL=1`.
webgl = ["wgpu/webgl"]

[dependencies]
rayon = { workspace = true, optional = true }
tracing = { workspace = true }
wgpu = { workspace = true }
naga = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
pollster = { workspace = true }

# On wasm32 the WebGPU backend's handles are not Send or Sync (they wrap `Rc`), which the
# layer traits need. wgpu offers them anyway for single threaded wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
