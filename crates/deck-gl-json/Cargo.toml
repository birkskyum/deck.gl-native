[package]
name = "deck-gl-json"
description = "JSON layer descriptions for deck.gl-native, compatible with @deck.gl/json and pydeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["fetch", "parquet", "flatgeobuf", "s2-cells", "parallel"]
# Spread tessellation over the cores with rayon, see `deck-gl`.
parallel = ["deck-gl-layers/parallel"]
# Load `data`, `image` and `iconAtlas` props from http(s) URLs.
fetch = ["dep:ureq", "deck-gl-layers/fetch"]
# `data` from Parquet and GeoParquet files.
parquet = ["dep:parquet", "dep:arrow-select", "dep:bytes", "dep:arrow-schema"]
# `data` from FlatGeobuf files.
flatgeobuf = ["dep:flatgeobuf", "dep:geozero"]
# S2 cells in the geo cell layers; off in a wasm build, see `deck-gl-layers`.
s2-cells = ["deck-gl-layers/s2-cells"]
# Draw through wgpu's WebGL2 backend, see `luma-gl`.
webgl = ["deck-gl-layers/webgl"]

[dependencies]
tracing = { workspace = true }
deck-gl = { workspace = true }
deck-gl-layers = { path = "../deck-gl-layers", default-features = false }
arrow-array = { workspace = true }
arrow-schema = { workspace = true, optional = true }
glam = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
csv = "1"
parquet = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
arrow-select = { workspace = true, optional = true }
flatgeobuf = { workspace = true, optional = true }
geozero = { workspace = true, optional = true }

[dev-dependencies]
a5 = "0.10"
arrow-schema = { workspace = true }
parquet = { workspace = true }
flatgeobuf = { workspace = true }
geozero = { workspace = true }
luma-gl = { workspace = true }
wgpu = { workspace = true }

# The `fetch` transport on everything but the web; a browser has its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", optional = true }
