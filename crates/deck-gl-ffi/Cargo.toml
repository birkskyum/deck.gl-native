[package]
name = "deck-gl-ffi"
description = "C ABI for deck.gl-native: embed deck.gl layers in a host renderer such as maplibre-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "deckgl"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
deck-gl = { workspace = true }
deck-gl-layers = { workspace = true }
deck-gl-json = { workspace = true }
deck-gl-examples = { path = "../../examples" }
wgpu = { workspace = true }
pollster = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
