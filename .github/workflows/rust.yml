name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver for GPU tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Render the example scene
        run: cargo run --release --bin texture_render -- target/texture-render.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texture-render-${{ matrix.os }}
          path: target/texture-render.png
          if-no-files-found: ignore

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The core crates build for the web through wgpu's WebGPU backend. The layer and JSON
      # crates need their native only features off: `fetch` (ureq pulls ring) and `s2-cells`
      # (the s2 crate has no wasm build).
      - run: cargo build --target wasm32-unknown-unknown -p math-gl -p luma-gl -p deck-gl
      - run: cargo build --target wasm32-unknown-unknown -p deck-gl-layers --no-default-features
      - run: cargo build --target wasm32-unknown-unknown -p deck-gl-json --no-default-features

  coverage:
    name: coverage (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install a software Vulkan driver for GPU tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path target/lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info
